<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Pulse</title>
  <meta name="description" content="Macros, recovery, recipes and gut health in one place.">
  <meta name="theme-color" content="#1E1656">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" id="mf" href="manifest.webmanifest">
  <script>
    // Developer mode (switched on from Me) runs the test build in /dev/.
    try { if (localStorage.getItem('pulseDev') === '1' && !location.pathname.includes('/dev/')) location.replace('dev/' + location.search); } catch {}
    // Pull-to-refresh reloads quietly: no logo placeholder while it boots.
    try { if (sessionStorage.getItem('pulseQuiet')) document.documentElement.classList.add('quiet'); } catch {}
    // ?demo installs as its own Home Screen app ("Pulse Demo") with sample data.
    if (new URLSearchParams(location.search).has('demo')) {
      document.getElementById('mf').href = 'manifest-demo.webmanifest';
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Pulse Demo';
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="main"><div class="welcome"><img src="icons/icon-192.png" class="logo pulse" alt=""></div></main>
    <button id="fab" data-act="add" aria-label="Add food" hidden>+</button>
    <nav id="nav" aria-label="Main">
      <button data-act="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>Today</button>
      <button data-act="tab" data-tab="food"><svg viewBox="0 0 24 24"><path d="M12 7c-1.3-2.2-4.6-2.6-6.3-.6-2.3 2.6-1.2 8.3 1.6 11.6 1.3 1.6 2.9 2.4 4.7 1.4 1.8 1 3.4.2 4.7-1.4 2.8-3.3 3.9-9 1.6-11.6C16.6 4.4 13.3 4.8 12 7zM12 7c0-2 1-3.5 3-4"/></svg>Food</button>
      <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/></svg>Plan</button>
      <button data-act="tab" data-tab="body"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M7.5 12h2.5l1.5-2.5 2 5 1.5-2.5h2"/></svg>Body</button>
      <button data-act="tab" data-tab="trends"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
