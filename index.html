<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulse</title>
  <meta name="description" content="Macros, recovery, recipes and gut health in one place.">
  <meta name="theme-color" content="#1E1656">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="main"><div class="welcome"><img src="icons/icon-192.png" class="logo pulse" alt=""></div></main>
    <button id="fab" data-act="add" aria-label="Add food" hidden>+</button>
    <nav id="nav" aria-label="Main">
      <button data-act="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>Today</button>
      <button data-act="tab" data-tab="foods"><svg viewBox="0 0 24 24"><path d="M12 7c-1.3-2.2-4.6-2.6-6.3-.6-2.3 2.6-1.2 8.3 1.6 11.6 1.3 1.6 2.9 2.4 4.7 1.4 1.8 1 3.4.2 4.7-1.4 2.8-3.3 3.9-9 1.6-11.6C16.6 4.4 13.3 4.8 12 7zM12 7c0-2 1-3.5 3-4"/></svg>Foods</button>
      <button data-act="tab" data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10M9 8h5"/></svg>Recipes</button>
      <button data-act="tab" data-tab="trends"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>
      <button data-act="tab" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Me</button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
